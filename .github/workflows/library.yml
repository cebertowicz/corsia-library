name: library checks

on:
  pull_request:
  push:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create explicit Python environment
        shell: bash
        run: |
          "${{ steps.setup-python.outputs.python-path }}" -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Check vendored workflow validator
        run: .venv/bin/python tools/check_vendor.py
      - name: Validate Agent Skills
        shell: bash
        run: |
          while IFS= read -r -d '' skill; do
            .venv/bin/skills-ref validate "$skill"
          done < <(find skills -type f -name SKILL.md -print0)
      - name: Check library envelope and generated index
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            .venv/bin/python tools/check_library.py --root . --base "$BASE_SHA"
          else
            .venv/bin/python tools/check_library.py --root .
          fi
      - name: Run seeded checks
        shell: bash
        run: .venv/bin/python -m pytest -q
