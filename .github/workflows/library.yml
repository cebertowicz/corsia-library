name: library checks

on:
  pull_request:
  # Feature branches are checked by their pull request against main's base;
  # a branch push would compare with the branch's own previous commit.
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A key in any commit of a contribution fails the check, so it never
      # reaches what installs pull. The branch is already public, so a real
      # key must be revoked as well as removed. A false match: add its
      # fingerprint to .gitleaksignore, or end the line with a
      # `gitleaks:allow` comment.
      - name: No committed keys (gitleaks)
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --retry 3 -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $tarball" | sha256sum --check --strict
          tar -xzf "$tarball" -C "$RUNNER_TEMP" gitleaks
          # No readable base (a new branch, or a force-push): scan all history.
          range=()
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            range=(--log-opts="${BASE_SHA}..${HEAD_SHA}")
          fi
          "$RUNNER_TEMP/gitleaks" git . --no-banner --redact --exit-code 1 "${range[@]}"
      - id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create explicit Python environment
        shell: bash
        run: |
          "${{ steps.setup-python.outputs.python-path }}" -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Check vendored workflow validator
        run: .venv/bin/python tools/check_vendor.py
      - name: Validate Agent Skills
        shell: bash
        run: |
          while IFS= read -r -d '' skill; do
            .venv/bin/skills-ref validate "$skill"
          done < <(find skills -type f -name SKILL.md -print0)
      - name: Check library envelope and generated index
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            .venv/bin/python tools/check_library.py --root . --base "$BASE_SHA"
          else
            .venv/bin/python tools/check_library.py --root .
          fi
      - name: Run seeded checks
        shell: bash
        run: .venv/bin/python -m pytest -q
